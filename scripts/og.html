<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Bricolage; src: url("../public/fonts/bricolage-grotesque-latin.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Martian Mono"; src: url("../public/fonts/martian-mono-latin.woff2") format("woff2"); font-weight: 100 800; }
  html, body { margin: 0; width: 1200px; height: 630px; background: #080b07; color: #f4f4eb; font-family: Bricolage, system-ui, sans-serif; font-optical-sizing: auto; overflow: hidden; }
  .wrap { width: 1200px; height: 630px; padding: 64px 72px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  .top, .foot { font-family: "Martian Mono", ui-monospace, monospace; font-size: 22px; color: #8b8d85; display: flex; justify-content: space-between; align-items: center; }
  .top strong { color: #f4f4eb; font-weight: 600; }
  h1 { margin: 0; font-size: 142px; font-weight: 700; letter-spacing: -0.045em; line-height: 0.9; }
  .foot { border-top: 1px solid #2b2f29; padding-top: 22px; white-space: nowrap; }
  .live { display: inline-flex; align-items: center; gap: 14px; color: #b0b2a9; }
  .live i { width: 14px; height: 14px; background: #d7ff3f; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span><strong>Tochi Mba</strong> · AI engineer and full-stack developer</span><span>United Kingdom</span></div>
  <h1>Agent systems<br>that ship.</h1>
  <div class="foot"><span class="live"><i></i>Built from GitHub, npm and PyPI daily</span><span>tochi-mba.github.io</span></div>
</div>
</body>
</html>
