# Every pull request: the same gates the deploy runs, against the committed snapshot. Once per pull
# request rather than once per push as well, which ran the whole browser matrix twice for each change.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      # Read-only, public data only: the contribution calendar, languages, releases.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Data, lint, types, unit tests with coverage, build, site checks
        run: npm run check
      - name: End-to-end tests in Chromium, Firefox and WebKit
        run: npm run test:e2e
      # Weight only: it is the same on every machine. Timings depend on the runner, so they are
      # compared locally (npm run perf) rather than checked here.
      - name: Page weight against the committed baseline
        run: npm run perf -- --weight --check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
