# Builds the site from every repository's own .portfolio/project.json and deploys it.
#
# It runs on every push to main and once a day, so a public repository that adds or changes its
# file reaches the site within a day with no commit here. The workflow's own token reads public
# repositories only; private projects come from the committed snapshot, unless the PORTFOLIO_TOKEN
# secret is set to a token that can read every repository, in which case they are refreshed too.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run finishes after the one in flight rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Read every repository's .portfolio/project.json
        run: npm run sync
      - name: Data, lint, types, unit tests with coverage, build, site checks
        run: npm run check
      - name: End-to-end tests in Chromium, Firefox and WebKit
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
